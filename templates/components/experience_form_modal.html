<div id="add-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
    <button type="button"
            class="project-form-modal_backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah pengalaman"></button>
    <div class="project-form-modal_content">
        <button type="button"
                class="project-form-modal_close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah pengalaman">x</button>
        <h2 id="add-experience-modal-title">Tambah Pengalaman Baru</h2>
        <form id="experience-form"
              method="post"
              action="{% url 'main:create_experience' %}"
              class="project-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="{{ field.id_for_label }}" style="display: block; margin-bottom: 0.3rem; font-weight: 600;">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <div class="project-form-modal_actions" style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-experience-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Pengalaman</button>
            </div>
        </form>
    </div>
</div>
