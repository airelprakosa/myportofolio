{% extends 'base.html' %}

{% block meta %}
<title>Skills | {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="background-section" id="skills" style="padding-top: 2rem;">
        <div class="container">
            <h2>Skills</h2>
            <div class="skills-grid">
                {% for skill in skill_list %}
                <div class="bg-card">
                    <span class="skill-tag">{{ skill.category }}</span>
                    <h3>{{ skill.title }}</h3>
                    <p>{{ skill.description }}</p>
                </div>
                {% empty %}
                <p style="color: var(--text-muted);">Belum ada skill yang ditambahkan.</p>
                {% endfor %}
            </div>
        </div>
    </section>
</main>
{% endblock content %}
