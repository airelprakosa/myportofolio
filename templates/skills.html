<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | {{ name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container site-nav-container">
            <a href="{% url 'main:show_main' %}#profile" class="brand">{{ name }}</a>
            <nav class="nav-menu">
                <a href="{% url 'main:show_main' %}#profile">Profile</a>
                <a href="{% url 'main:show_main' %}#about-me">About Me</a>
                <a href="{% url 'main:show_skills' %}">Skills</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_projects' %}">Projects</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="background-section" id="skills" style="padding-top: 2rem;">
            <div class="container">
                <h2>Skills</h2>
                <div class="skills-grid">
                    {% for skill in skill_list %}
                    <div class="bg-card">
                        <span class="skill-tag">{{ skill.category }}</span>
                        <h3>{{ skill.title }}</h3>
                        <p>{{ skill.description }}</p>
                    </div>
                    {% empty %}
                    <p style="color: var(--text-muted);">Belum ada skill yang ditambahkan.</p>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
